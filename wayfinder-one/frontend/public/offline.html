<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayfinder One — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f6f3ec;
        color: #14181f;
      }
      main {
        max-width: 26rem;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.5rem 0;
      }
      p {
        color: #4a5160;
        line-height: 1.5;
      }
      .dot {
        width: 44px;
        height: 44px;
        margin: 0 auto;
        border-radius: 50%;
        background: #0b6e75;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>
        Wayfinder One keeps your downloaded trip pack available without a network. Open the app — itineraries, vouchers,
        Plan B and contacts load from the pack. Booking and switching need a connection.
      </p>
    </main>
  </body>
</html>
